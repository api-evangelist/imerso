aid: imerso
name: Imerso
description: >-
  Imerso is a construction management and quality-control software company that connects the
  onsite as-built reality to BIM models. Using 3D laser scanning (including a free Imerso Capture
  mobile app for Leica BLK360 scanners) and in-house AI models, its Site Checker automatically
  compares the built status of a jobsite against BIM plan specifications, surfacing deviations,
  progress tracking, and as-built data grouped by traffic-light categories. The platform targets
  general contractors and BIM teams for automated site supervision, progress reporting, and issue
  detection, and promotes 100% open data with direct integrations into tools such as Autodesk
  Construction Cloud. Imerso is a 500 Global portfolio company. No public developer API, SDK, or
  documentation surface has been found; this profile is maintained as a company record.
